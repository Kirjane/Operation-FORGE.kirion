name: FCI-M02 Behavioral Pilot Calibration

on:
  pull_request:
    paths:
      - 'evals/fci-m02-pilot/**'
      - '.github/workflows/fci-m02-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-calibration:
    name: pilot-calibration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scorer syntax
        run: node --check evals/fci-m02-pilot/score.cjs
      - name: Validate expected-source paths in static scenarios
        run: |
          node -e "const fs=require('fs');const m=require('./evals/fci-m02-pilot/scenarios.json');if(m.version!==1||m.scenarios.length!==7)process.exit(1);for(const s of m.scenarios){for(const p of s.required_sources){if(!fs.existsSync(p))throw Error('Missing canonical eval source: '+p)}}console.log('7 synthetic scenarios and canonical source paths: PASS')"
      - name: Calibrate scoring rules on SYNTHETIC responses only
        run: node evals/fci-m02-pilot/score.cjs --self-test
