name: ChatGPT Forge R4 qualification (isolated QA only)
on:
  push:
    branches: [qa/chatgpt-port-qualification-r2]
permissions:
  contents: read
concurrency:
  group: forge-chatgpt-qa-r4
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  comparative:
    name: Compare ${{ matrix.suite }} (same runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [core, A, B, C, D, E]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        if: matrix.suite == 'A'
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: matrix.suite == 'B'
        with:
          dotnet-version: '10.0.x'
      - name: Execute exact baseline and candidate
        env:
          SUITE: ${{ matrix.suite }}
        run: python integrations/chatgpt/qa-r2/compare.py "$SUITE" "$RUNNER_TEMP/forge-evidence"
      - name: Preserve logs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-r4-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forge-evidence/
          if-no-files-found: error
          retention-days: 30
  adapter-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Actual connector, bridge and package checks
        run: python integrations/chatgpt/qa-r2/compare.py adapter "$RUNNER_TEMP/forge-evidence"
      - name: Preserve logs and uninstalled ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-r4-adapter-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forge-evidence/
          if-no-files-found: error
          retention-days: 30
