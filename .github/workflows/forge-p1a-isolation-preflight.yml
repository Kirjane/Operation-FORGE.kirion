name: FORGE P1a hosted isolation preflight
on:
  push:
    branches: [infra/forge-p1a-hosted-qualification]
    paths: ['.github/workflows/forge-p1a-isolation-preflight.yml']
permissions: {}
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Construct disposable benign source and runner
        shell: bash
        run: |
          set -euo pipefail
          D=$(mktemp -d)
          echo "P1A_DIR=$D" >> "$GITHUB_ENV"
          mkdir -p "$D"/{source,probe,root,output}
          printf '%s\n' 'benign synthetic source; no candidate' > "$D/source/sentinel.txt"
          cat > "$D/probe/test_benign.py" <<'PY'
          import unittest
          class Benign(unittest.TestCase):
              def test_arithmetic(self):
                  self.assertEqual(2+2,4)
          PY
          cat > "$D/probe/launcher.py" <<'PY'
          import ctypes, errno, fcntl, hashlib, os, pathlib, resource, socket, stat, sys, unittest
          P=pathlib.Path
          def require(ok,msg):
              if not ok: raise RuntimeError("FAIL_CLOSED: "+str(msg))
          opt,mode=sys.argv[1:]
          require(opt in ("0","1") and sys.flags.optimize==int(opt),"optimization")
          require(sys.flags.isolated and sys.flags.no_site and sys.dont_write_bytecode,"python flags")
          require(set(os.environ)<= {"PATH","LANG","LC_CTYPE"},"environment")
          require(all(not P(p).exists() for p in ["/home","/root","/run","/mnt","/var","/etc","/proc/self"]),"host mounts")
          require(stat.S_ISCHR(os.fstat(77).st_mode),"controlled fd")
          libc=ctypes.CDLL(None,use_errno=True)
          libc.close_range.argtypes=[ctypes.c_uint,ctypes.c_uint,ctypes.c_int]
          require(libc.close_range(3,0xffffffff,0)==0,"close_range")
          require(stat.S_ISCHR(os.fstat(0).st_mode) and os.major(os.fstat(0).st_rdev)==1 and os.minor(os.fstat(0).st_rdev)==3,"stdin")
          require(all(stat.S_ISREG(os.fstat(i).st_mode) for i in (1,2)),"log descriptors")
          for i in range(3,resource.getrlimit(resource.RLIMIT_NOFILE)[0]):
              try: fcntl.fcntl(i,fcntl.F_GETFD)
              except OSError as e: require(e.errno==errno.EBADF,"fd scan")
              else: raise RuntimeError("inherited descriptor")
          require(libc.prctl(39,0,0,0,0)==1 and all(libc.prctl(23,i,0,0,0)==0 for i in range(41)),"NNP/bounding caps")
          cap=ctypes.CDLL("libcap.so.2")
          cap.cap_get_proc.restype=ctypes.c_void_p
          cap.cap_to_text.argtypes=[ctypes.c_void_p,ctypes.c_void_p]
          cap.cap_to_text.restype=ctypes.c_void_p
          cap.cap_free.argtypes=[ctypes.c_void_p]
          x=cap.cap_get_proc(); require(bool(x),"caps")
          y=cap.cap_to_text(x,None); require(bool(y) and ctypes.string_at(y)==b"=","effective caps")
          require(cap.cap_free(y)==0 and cap.cap_free(x)==0,"cap free")
          lib=ctypes.CDLL("libseccomp.so.2")
          lib.seccomp_init.argtypes=[ctypes.c_uint32]; lib.seccomp_init.restype=ctypes.c_void_p
          lib.seccomp_syscall_resolve_name.argtypes=[ctypes.c_char_p]; lib.seccomp_syscall_resolve_name.restype=ctypes.c_int
          lib.seccomp_rule_add.argtypes=[ctypes.c_void_p,ctypes.c_uint32,ctypes.c_int,ctypes.c_uint]; lib.seccomp_rule_add.restype=ctypes.c_int
          lib.seccomp_load.argtypes=[ctypes.c_void_p]; lib.seccomp_load.restype=ctypes.c_int
          lib.seccomp_release.argtypes=[ctypes.c_void_p]
          allowed="read write close openat newfstatat fstat stat lstat statx lseek pread64 readv writev getdents64 readlink readlinkat access faccessat faccessat2 getcwd brk mmap munmap mprotect mremap madvise futex rt_sigaction rt_sigprocmask rt_sigreturn sigaltstack clock_gettime clock_getres gettimeofday getrandom getpid gettid getuid geteuid getgid getegid uname sysinfo sched_getaffinity prlimit64 getrlimit fcntl ioctl arch_prctl rseq set_robust_list set_tid_address exit exit_group prctl".split()
          ctx=lib.seccomp_init(0x00050000|errno.EPERM); require(bool(ctx),"seccomp init")
          try:
              for name in allowed:
                  nr=lib.seccomp_syscall_resolve_name(name.encode()); require(nr>=0,name)
                  rc=lib.seccomp_rule_add(ctx,0xdead0000 if mode=="fault" else 0x7fff0000,nr,0)
                  if mode=="fault":
                      print("INDUCED_RULE_FAILURE",rc,flush=True)
                      require(rc!=0,"fault unexpectedly accepted")
                      raise RuntimeError("EXPECTED_RULE_FAILURE")
                  require(rc==0,("rule",name,rc))
              require(lib.seccomp_load(ctx)==0,"filter load")
          finally: lib.seccomp_release(ctx)
          require(libc.prctl(21,0,0,0,0)==2,"filter")
          print("FILTER_MODE=2 DEFAULT_DENY_ALLOWLIST",len(allowed),flush=True)
          def deny(label,fn,errors):
              try: fn()
              except OSError as e: require(e.errno in errors,(label,e.errno)); print(label,"DENIED",e.errno,flush=True)
              else: raise RuntimeError(label+" unexpected success")
          for path in ("/source/denied","/usr/forge-denied","/probe/denied","/outside"):
              deny("WRITE "+path,lambda path=path:P(path).write_text("benign"),{errno.EROFS})
          deny("SOCKET",lambda:socket.socket(socket.AF_INET,socket.SOCK_STREAM),{errno.EPERM})
          deny("FORK",os.fork,{errno.EPERM})
          deny("EXEC",lambda:os.execve("/no-such-program",["no-such-program"],{}),{errno.EPERM})
          deny("UNLINK_SOURCE",lambda:os.unlink("/source/sentinel.txt"),{errno.EPERM,errno.EROFS})
          deny("MKDIR",lambda:os.mkdir("/outside"),{errno.EPERM,errno.EROFS})
          deny("CHMOD",lambda:os.chmod("/source/sentinel.txt",0o600),{errno.EPERM,errno.EROFS})
          libc.mount.argtypes=[ctypes.c_char_p,ctypes.c_char_p,ctypes.c_char_p,ctypes.c_ulong,ctypes.c_void_p]
          ctypes.set_errno(0)
          require(libc.mount(b"none",b"/no-such-target",b"tmpfs",0,None)==-1 and ctypes.get_errno()==errno.EPERM,"mount deny")
          print("MOUNT_DENIED",flush=True)
          P("/scratch/sentinel").write_text("scratch only")
          sys.path.insert(0,"/probe")
          result=unittest.main(module=None,argv=["unittest","-v","test_benign"],exit=False).result
          require(result.wasSuccessful() and result.testsRun==1,"benign test")
          print("BENIGN_DISPATCH_PASS OPT",opt,"PYTHON",sys.version,"INTERPRETER_SHA256",hashlib.sha256(P(sys.executable).read_bytes()).hexdigest(),flush=True)
          for name,m in sorted(sys.modules.items()):
              f=getattr(m,"__file__",None)
              if f:
                  p=P(f).resolve()
                  require(p.is_relative_to("/usr") or p.is_relative_to("/probe"),("origin",name,str(p)))
                  require(not str(p).endswith(".pyc"),"pyc")
                  if p.is_file(): print("RUNTIME_ORIGIN",name,str(p),hashlib.sha256(p.read_bytes()).hexdigest())
          print("PREFLIGHT_PASS NO_CANDIDATE_EXECUTION",flush=True)
          PY
          cat > "$D/probe/run.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          D=$1; opt=$2; mode=$3; R=$D/root
          mount --make-rprivate /
          mount -t tmpfs -o size=16m,nosuid,nodev tmpfs "$R"
          mkdir -p "$R"/{usr,source,probe,scratch}
          ln -s usr/lib "$R/lib"; ln -s usr/lib64 "$R/lib64"; ln -s usr/bin "$R/bin"
          mount --bind /usr "$R/usr"; mount -o remount,bind,ro,nosuid,nodev "$R/usr"
          for n in source probe; do
            mount --bind "$D/$n" "$R/$n"
            mount -o remount,bind,ro,nosuid,nodev,noexec "$R/$n"
          done
          mount --bind "$D/output" "$R/scratch"; mount -o remount,bind,rw,nosuid,nodev,noexec "$R/scratch"
          mount -o remount,ro,nosuid,nodev "$R"
          links=$(ip -brief link); echo "$links"
          test "$(echo "$links" | awk 'END{print NR}')" = 1
          test "$(echo "$links" | awk '{print $1,$2}')" = 'lo DOWN'
          for path in "$R" "$R/usr" "$R/source" "$R/probe" "$R/scratch"; do
            test "$(findmnt -n -o TARGET --target "$path")" = "$path"
            opts=$(findmnt -n -o OPTIONS --target "$path")
            echo "MOUNT $path $opts"
            flags='nosuid nodev ro'
            case "$path" in "$R/source"|"$R/probe") flags="$flags noexec";; "$R/scratch") flags='nosuid nodev rw noexec';; esac
            for f in $flags; do case ",$opts," in *",$f,"*) ;; *) exit 66;; esac; done
          done
          test "$(findmnt -R -n -o TARGET "$R" | wc -l)" = 5
          args=(); if test "$opt" = 1; then args+=(-O); fi
          ulimit -n 1024
          exec 77</dev/null
          exec chroot "$R" /usr/bin/setpriv --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all /usr/bin/env -i PATH=/usr/bin LANG=C /usr/bin/python3 "${args[@]}" -I -B -S -X pycache_prefix=/probe/nonexistent-cache /probe/launcher.py "$opt" "$mode"
          SH
          sha256sum "$D/source/sentinel.txt" "$D/probe/"* 
      - name: Measure isolated normal and optimized benign dispatch
        shell: bash
        run: |
          set -euo pipefail
          D=$P1A_DIR
          printf 'ImageOS=%s ImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -srmo
          dpkg-query -W python3 libseccomp2 libcap2 util-linux
          sha256sum /usr/bin/python3
          before=$(sha256sum "$D/source/sentinel.txt")
          for opt in 0 1; do
            sudo -n unshare --mount --net --fork /bin/bash "$D/probe/run.sh" "$D" "$opt" benign </dev/null >"$D/normal-$opt.log" 2>&1 || { cat "$D/normal-$opt.log"; exit 1; }
            cat "$D/normal-$opt.log"
            grep -F 'PREFLIGHT_PASS NO_CANDIDATE_EXECUTION' "$D/normal-$opt.log"
            set +e
            sudo -n unshare --mount --net --fork /bin/bash "$D/probe/run.sh" "$D" "$opt" fault </dev/null >"$D/fault-$opt.log" 2>&1
            rc=$?
            set -e
            cat "$D/fault-$opt.log"
            test "$rc" -ne 0
            grep -F 'EXPECTED_RULE_FAILURE' "$D/fault-$opt.log"
            if grep -F 'BENIGN_DISPATCH_PASS' "$D/fault-$opt.log"; then exit 1; fi
          done
          test "$before" = "$(sha256sum "$D/source/sentinel.txt")"
          echo 'BENIGN_ISOLATION_PREFLIGHT_COMPLETE; CANDIDATE_NOT_RUN'
